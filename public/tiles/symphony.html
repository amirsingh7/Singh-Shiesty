<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Symphony</title>
<!--
  SYMPHONY — Spotify playback control. Phase 1: connect + full manual
  control (play/pause/skip/volume/shuffle/repeat/device selector). No
  workout-linked automation yet — that needs Train to emit live session
  events, which it doesn't do today.

  Sealed tile, no network of its own (opaque-origin iframe). Every action —
  including OAuth connect — goes through window.Vitality.spotify(action,
  extra), which the host proxies to /api/spotify/player (or, for 'connect',
  opens a real OAuth popup — see lib/tiles/useTileHost.ts). This tile never
  sees a Spotify token; the host and the API routes hold those.
-->
<style>
  :root{
    --bg:#100c09;--fg:#f5ede2;--brand:#D98E4A;
    --muted:#8c8175;--muted-strong:#ada395;--border:#241c15;--border-strong:#332821;
    --bad:#ff8b8b;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);display:flex;justify-content:center;padding:40px 20px;-webkit-font-smoothing:antialiased}
  .shell{width:100%;max-width:420px}
  h1{font-size:24px;font-weight:600;letter-spacing:-.01em}

  .connect{margin-top:40px;text-align:center}
  .connect p{color:var(--muted);font-size:13px;margin:14px auto 0;max-width:32ch;line-height:1.6}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:10px;border:1px solid rgba(217, 142, 74,.4);
    background:linear-gradient(180deg,rgba(217, 142, 74,.10),rgba(217, 142, 74,.03));color:var(--brand);font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s;font-family:inherit}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 26px -10px rgba(217, 142, 74,.5)}
  .btn .dot{width:8px;height:8px;border-radius:99px;background:var(--brand);box-shadow:0 0 10px var(--brand)}

  .msg{margin-top:18px;padding:12px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--muted-strong);font-size:12.5px;line-height:1.5;text-align:center}
  .msg.err{border-color:rgba(255,139,139,.3);color:var(--bad)}

  .player{margin-top:8px}
  .art{width:100%;aspect-ratio:1;border-radius:16px;background:var(--border) center/cover no-repeat;border:1px solid var(--border-strong)}
  .art.empty{display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .meta{margin-top:16px;text-align:center}
  .title{font-size:16px;font-weight:600;color:#f5ede2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .artist{color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .prog{margin-top:16px}
  .progBar{height:3px;border-radius:2px;background:var(--border);overflow:hidden}
  .progFill{height:100%;background:var(--brand);border-radius:2px;transition:width .3s linear}
  .progTime{display:flex;justify-content:space-between;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted);margin-top:6px}

  .controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:20px}
  .ctl{background:none;border:none;color:var(--muted-strong);cursor:pointer;padding:8px;border-radius:10px;transition:color .15s,background .15s;display:flex}
  .ctl:hover{color:#f5ede2;background:rgba(255,255,255,.06)}
  .ctl.on{color:var(--brand)}
  .ctl.play{color:#04140d;background:var(--brand);padding:12px}
  .ctl.play:hover{background:#E8B17E}
  .ctl svg{width:18px;height:18px}
  .ctl.play svg{width:20px;height:20px}
  .ctl.small svg{width:15px;height:15px}

  .row{display:flex;align-items:center;gap:10px;margin-top:18px}
  .row .lab{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:44px;flex:none}
  input[type=range]{flex:1;accent-color:var(--brand)}
  select{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--fg);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:12.5px}

  .foot{margin-top:22px;text-align:center}
  .disconnect{background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:2px}
  .disconnect:hover{color:var(--muted-strong)}
</style>
</head>
<body>
<div class="shell">
  <h1>Symphony</h1>
  <div id="app"></div>
</div>
<script>
var state = { phase: 'loading', status: null, devices: [], toast: null, localProgress: 0 };
var pollTimer = null, tickTimer = null;

function fmtMs(ms){
  if (!ms || ms < 0) ms = 0;
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  s = s % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

var REASON_TEXT = {
  premium_required: 'Spotify Premium is required for playback control.',
  no_active_device: 'No active Spotify device. Open Spotify somewhere and start playing, then pick it below.',
  reauth_required: 'Your Spotify connection expired.',
  spotify_error: 'Something went wrong talking to Spotify. Try again.',
};

function flash(reason){
  state.toast = REASON_TEXT[reason] || reason || null;
  render();
  if (state.toast) setTimeout(function(){ state.toast = null; render(); }, 4000);
}

async function refreshStatus(){
  try {
    var r = await window.Vitality.spotify('status');
    if (!r || r.connected === false) { state.phase = 'disconnected'; state.status = null; }
    else { state.phase = 'connected'; state.status = r; state.localProgress = r.progressMs || 0; }
  } catch (e) {
    if (String(e.message) === 'reauth_required') { state.phase = 'disconnected'; }
    else { state.phase = state.status ? 'connected' : 'disconnected'; }
  }
  render();
}

async function refreshDevices(){
  try {
    var r = await window.Vitality.spotify('devices');
    state.devices = (r && r.devices) || [];
  } catch (e) { state.devices = []; }
  render();
}

async function act(action, extra){
  try {
    var r = await window.Vitality.spotify(action, extra);
    if (r && r.error) { flash(r.error); return; }
    await refreshStatus();
  } catch (e) {
    flash(String(e.message || 'spotify_error'));
  }
}

function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(function(){ if (state.phase === 'connected') refreshStatus(); }, 5000);
  clearInterval(tickTimer);
  tickTimer = setInterval(function(){
    if (state.phase === 'connected' && state.status && !state.status.idle && state.status.isPlaying && state.status.track) {
      state.localProgress = Math.min(state.status.track.durationMs || Infinity, state.localProgress + 1000);
      var fill = document.getElementById('progFill'), tEl = document.getElementById('progNow');
      if (fill && state.status.track.durationMs) fill.style.width = (state.localProgress / state.status.track.durationMs * 100) + '%';
      if (tEl) tEl.textContent = fmtMs(state.localProgress);
    }
  }, 1000);
}

function connectView(){
  return '<div class="connect">'
    + '<button class="btn" data-connect><span class="dot"></span>Connect Spotify</button>'
    + '<p>Control playback — play, pause, skip, volume, and pick a device — without leaving the dashboard.</p>'
    + (state.toast ? '<div class="msg err">' + esc(state.toast) + '</div>' : '')
    + '</div>';
}

function idleView(){
  return '<div class="player">'
    + '<div class="art empty">Nothing playing</div>'
    + '<div class="foot"><button class="disconnect" data-disconnect>Disconnect</button></div>'
    + (state.toast ? '<div class="msg">' + esc(state.toast) + '</div>' : '')
    + '</div>';
}

function playerView(){
  var s = state.status, t = s.track;
  var artStyle = t && t.albumArt ? ' style="background-image:url(' + esc(t.albumArt) + ')"' : '';
  var pct = t && t.durationMs ? Math.min(100, (state.localProgress / t.durationMs) * 100) : 0;
  var vol = s.device && typeof s.device.volumePercent === 'number' ? s.device.volumePercent : 50;
  var deviceOpts = state.devices.map(function(d){
    return '<option value="' + esc(d.id) + '"' + (s.device && d.id === s.device.id ? ' selected' : '') + '>' + esc(d.name) + '</option>';
  }).join('');

  return '<div class="player">'
    + '<div class="art' + (t ? '' : ' empty') + '"' + artStyle + '>' + (t ? '' : 'Nothing playing') + '</div>'
    + (t ? '<div class="meta"><div class="title">' + esc(t.name) + '</div><div class="artist">' + esc(t.artists) + '</div></div>' : '')
    + (t ? '<div class="prog"><div class="progBar"><div class="progFill" id="progFill" style="width:' + pct + '%"></div></div>'
        + '<div class="progTime"><span id="progNow">' + fmtMs(state.localProgress) + '</span><span>' + fmtMs(t.durationMs) + '</span></div></div>' : '')
    + '<div class="controls">'
      + '<button class="ctl small' + (s.shuffle ? ' on' : '') + '" data-shuffle title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4l9 16h3"/><path d="M4 20h4l3-5.2"/><path d="M15 4h5v5"/><path d="M20 4l-6 9"/></svg></button>'
      + '<button class="ctl" data-prev title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L10 12l10 6z"/></svg></button>'
      + '<button class="ctl play" data-playpause title="Play/Pause">' + (s.isPlaying
          ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l13 7-13 7z"/></svg>') + '</button>'
      + '<button class="ctl" data-next title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10 6L4 18z"/></svg></button>'
      + '<button class="ctl small' + (s.repeat !== 'off' ? ' on' : '') + '" data-repeat title="Repeat (' + esc(s.repeat) + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>' + (s.repeat === 'track' ? '<circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>' : '') + '</button>'
    + '</div>'
    + '<div class="row"><span class="lab">Vol</span><input type="range" min="0" max="100" value="' + vol + '" data-volume /></div>'
    + (state.devices.length ? '<div class="row"><span class="lab">Device</span><select data-device>' + deviceOpts + '</select></div>' : '')
    + '<div class="foot"><button class="disconnect" data-disconnect>Disconnect</button></div>'
    + (state.toast ? '<div class="msg">' + esc(state.toast) + '</div>' : '')
    + '</div>';
}

function render(){
  var app = document.getElementById('app');
  if (state.phase === 'loading') { app.innerHTML = ''; return; }
  if (state.phase === 'disconnected') { app.innerHTML = connectView(); return; }
  app.innerHTML = state.status && state.status.idle ? idleView() : playerView();
}

document.addEventListener('click', function(e){
  if (e.target.closest('[data-connect]')) { window.Vitality.spotify('connect'); return; }
  if (e.target.closest('[data-disconnect]')) { act('disconnect'); state.devices = []; return; }
  if (e.target.closest('[data-playpause]')) { act(state.status && state.status.isPlaying ? 'pause' : 'play'); return; }
  if (e.target.closest('[data-next]')) { act('next'); return; }
  if (e.target.closest('[data-prev]')) { act('previous'); return; }
  if (e.target.closest('[data-shuffle]')) { act('shuffle', { state: !(state.status && state.status.shuffle) }); return; }
  if (e.target.closest('[data-repeat]')) {
    var cur = (state.status && state.status.repeat) || 'off';
    var next = cur === 'off' ? 'context' : cur === 'context' ? 'track' : 'off';
    act('repeat', { state: next });
    return;
  }
});
document.addEventListener('change', function(e){
  if (e.target.matches('[data-volume]')) { act('volume', { volumePercent: Number(e.target.value) }); return; }
  if (e.target.matches('[data-device]')) { act('transfer', { deviceId: e.target.value }); return; }
});

if (!window.Vitality) {
  window.Vitality = { spotify: function(){ return Promise.resolve({ connected: false }); }, onSpotifyConnected: function(){} };
}
window.Vitality.onSpotifyConnected(async function(){
  await refreshStatus();
  if (state.phase === 'connected') await refreshDevices();
});

(async function(){
  await refreshStatus();
  if (state.phase === 'connected') await refreshDevices();
  startPolling();
})();
</script>
</body>
</html>
